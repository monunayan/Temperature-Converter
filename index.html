<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Temperature Converter</h1>
    <div id="contaner">
        <div class="cel" id="cel">
            <label for="" id="label">Celsius</label>
            <br>
            <input type="number" name="" id="temp" value=0>
        </div>
        <div class="cel" id="fer">
            <label for="">Fahrenheit</label> <br>
            <input type="number" name="FOREN" id="for" value=32>
        </div>
        <h4>=</h4>
    </div>
</body>
<style>
    h1 {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 0px
}

#contaner {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background-color: #005;

}

.cel {
    background-color: #005;


}

label {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-size: 25px;
    font-weight: 300;
    color: white;
}

input {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 0px 20px;
    font-size: 20px;
}

h4 {
    display: flex;
    justify-content: center;
    position: relative;
    top: 45px;
    right: 300px;
    color: white;
    font-size: 30px;
    font-weight: 500;
}
</style>
<script>
    let cel = document.getElementById("temp");
let far = document.getElementById('for');
cel.addEventListener('input', function () {
    let c = this.value;
    let f = (c * 9 / 5) + 32;
    far.value = f
    if (!Number.isInteger(f)) {
        f = f.toFixed(4)
    }
})
far.addEventListener("input", function () {
    let f = this.value;
    let c = (f - 32) * 5 / 9;
    cel.value = c
    if (!Number.isInteger(c)) {
        c = c.toFixed(4)
    }
})
</script>

</html>
